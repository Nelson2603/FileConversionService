spring:
  application:
    name: FileConversionService

    main:
      allow-circular-references: true

  datasource:
    url: jdbc:postgresql://localhost:5432/converter_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: file-conversion-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: conversion-files

app:
  kafka:
    input-topic: file-conversion-requests
    output-topic: file-conversion-responses

    liquibase:
      enabled: true
      change-log: classpath:/db/changelog/db.changelog-master.yaml