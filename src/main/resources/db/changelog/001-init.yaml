databaseChangeLog:
  - changeSet:
      id: 1
      author: nail

      changes:

        - createTable:
            tableName: inbox_messages

            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: message_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: processed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createTable:
            tableName: outbox_messages

            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: message_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: topic
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: processed_at
                  type: TIMESTAMP

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false